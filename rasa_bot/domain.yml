version: "3.1" 
 
intents: 
  - greet 
  - goodbye 
  - affirm 
  - deny 
  - mood_great 
  - mood_unhappy 
  - bot_challenge 
  - nlu_fallback 
  - ask_source 
  - inform 
  - out_of_scope 
  - inform_failure 
  - ask_human 
  - view_ticket 
 
actions: 
  - action_handle_rag_failure 
  - action_query_rag 
  - action_explain_source 
  - action_submit_ticket_form 
  - action_transfer_to_human 
  - action_view_ticket 
 
responses: 
  utter_greet: 
    - text: "Bonjour! Comment puis-je vous aider ?" 
 
  utter_happy: 
    - text: "Bien!" 
 
  utter_goodbye: 
    - text: "Au revoir" 
 
  utter_iamabot: 
    - text: "Je suis un bot." 
 
  utter_cheer_up: 
    - text: "Je suis désolé. Puis-je vous aider d'une autre manière?" 
 
  utter_did_that_help: 
    - text: "Est-ce que cela a aidé?" 
 
  utter_ask_ticket_details: 
    - text: "Décrivez votre problème." 
 
  utter_propose_transfert: 
    - text: "Voulez-vous parler à un agent ?" 
 
slots: 
  last_source: 
    type: text 
    influence_conversation: false 
    mappings: 
      - type: custom 
 
  rag_failure_count: 
    type: any 
    initial_value: 0 
    influence_conversation: false 
    mappings: 
      - type: custom
version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - nlu_fallback
  - ask_source
  - inform
  - out_of_scope
  - inform_failure

actions:
  - action_query_rag
  - action_explain_source


responses:
  utter_greet:
  - text: "Bonjour! Comment puis-je vous aider ?"

  utter_happy:
  - text: "Bien!"

  utter_goodbye:
  - text: "Au revoir"

  utter_iamabot:
  - text: "Je suis un bot."

  utter_cheer_up:
  - text: "Je suis désolé. Puis-je vous aider d'une autre manière?"

  utter_did_that_help:
  - text: "Est-ce que cela a aidé?"

slots:
  last_source:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  rag_failure_count:
    type: any
    initial_value: 0
    influence_conversation: false
    mappings:
      - type: custom

